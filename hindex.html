<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória Tech - Ranking Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00d4ff; margin-bottom: 5px; }
        p { color: #cccccc; margin-top: 0; }
        .painel {
            background: #2a2a40;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        input {
            padding: 8px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            background-color: #00d4ff;
            color: #1e1e2f;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #00aacc; }
        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 10px;
            margin-bottom: 30px;
        }
        .carta {
            width: 80px;
            height: 80px;
            background-color: #3b3b58;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .carta.virada {
            background-color: #00d4ff;
            color: #1e1e2f;
            transform: rotateY(180deg);
        }
        .ranking {
            background: #2a2a40;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
        }
        .ranking h2 { margin-top: 0; color: #00d4ff; font-size: 20px; }
        ul { list-style: none; padding: 0; }
        li {
            background: #3b3b58;
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <h1>Jogo da Memória</h1>
    <p>Encontre todos os pares com o menor número de tentativas!</p>

    <div class="painel">
        <input type="text" id="nomeJogador" placeholder="Seu nome..." required>
        <button onclick="iniciarJogo()">Novo Jogo</button>
        <span>Tentativas: <strong id="contador">0</strong></span>
    </div>

    <div class="tabuleiro" id="tabuleiro"></div>

    <div class="ranking">
        <h2>🏆 Melhores Jogadores</h2>
        <ul id="listaRanking">
            <li>Carregando ranking...</li>
        </ul>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://gstatic.com";

        // COLE SUAS CHAVES DO FIREBASE AQUI DENTRO
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_://firebaseapp.com",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_://appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const emojis = ['🚀', '💻', '🎮', '🔥', '⚡', '🎯', '🚀', '💻', '🎮', '🔥', '⚡', '🎯'];
        let cartasViradas = [];
        let paresEncontrados = 0;
        let tentativas = 0;
        let bloqueado = false;

        window.iniciarJogo = function() {
            const nome = document.getElementById('nomeJogador').value.trim();
            if (!nome) {
                alert("Digite seu nome antes de começar!");
                return;
            }
            
            const tabuleiro = document.getElementById('tabuleiro');
            tabuleiro.innerHTML = '';
            cartasViradas = [];
            paresEncontrados = 0;
            tentativas = 0;
            bloqueado = false;
            document.getElementById('contador').innerText = tentativas;

            const embaralhado = [...emojis].sort(() => Math.random() - 0.5);

            embaralhado.forEach((emoji) => {
                const carta = document.createElement('div');
                carta.classList.add('carta');
                carta.dataset.valor = emoji;
                carta.innerText = '?';
                carta.onclick = () => virarCarta(carta);
                tabuleiro.appendChild(carta);
            });
        };

        function virarCarta(carta) {
            if (bloqueado || carta.classList.contains('virada')) return;

            carta.classList.add('virada');
            carta.innerText = carta.dataset.valor;
            cartasViradas.push(carta);

            if (cartasViradas.length === 2) {
                tentativas++;
                document.getElementById('contador').innerText = tentativas;
                verificarPar();
            }
        }

        function verificarPar() {
            bloqueado = true;
            const [carta1, carta2] = cartasViradas;

            if (carta1.dataset.valor === carta2.dataset.valor) {
                paresEncontrados++;
                cartasViradas = [];
                bloqueado = false;

                if (paresEncontrados === emojis.length / 2) {
                    salvarPontuacao();
                }
            } else {
                setTimeout(() => {
                    carta1.classList.remove('virada');
                    carta1.innerText = '?';
                    carta2.classList.remove('virada');
                    carta2.innerText = '?';
                    cartasViradas = [];
                    bloqueado = false;
                }, 800);
            }
        }

        async function salvarPontuacao() {
            const nome = document.getElementById('nomeJogador').value.trim();
            alert(`Parabéns ${nome}! Você venceu em ${tentativas} tentativas.`);
            
            try {
                await addDoc(collection(db, "ranking"), {
                    nome: nome,
                    tentativas: tentativas,
                    data: new Date()
                });
                carregarRanking();
            } catch (e) {
                console.error("Erro ao salvar no banco: ", e);
            }
        }

        async function carregarRanking() {
            const lista = document.getElementById('listaRanking');
            lista.innerHTML = '';
            try {
                const q = query(collection(db, "ranking"), orderBy("tentativas", "asc"), limit(5));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    lista.innerHTML = '<li>Nenhuma pontuação registrada ainda.</li>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    const item = document.createElement('li');
                    item.innerHTML = `<span>${dados.nome}</span> <strong>${dados.tentativas} tent.</strong>`;
                    lista.appendChild(item);
                });
            } catch (e) {
                lista.innerHTML = '<li>Configure o Firebase para ver o ranking.</li>';
            }
        }

        carregarRanking();
    </script>
</body>
</html>
